plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}
android {
    namespace = "com.mahesh.workouttracker"
    compileSdk = 34
    // v2.9.1: pin the debug signing key. The default debug keystore lives
    // in /root/.android on ephemeral VM storage, so the app's signing
    // SHA-1 silently changed whenever the build machine was replaced
    // (v1 0528…, v2/v2.1 8f27…, v2.2-v2.4 7c22…, v2.5-v2.7 7b82…,
    // v2.8/v2.8.1 bb0c…, v2.9 0a1a…). Google sign-in matches the app by
    // package + this SHA-1, so a rotating key breaks it. The keystore is
    // copied to the persisted workspace (~/workspace/.tooling/signing/,
    // NOT in this repo — it is a private key) and every build from now on
    // signs with SHA-1 0A:1A:71:63:12:09:A8:1A:7B:69:F7:F0:C2:B6:2A:53:
    // 4A:A8:46:CE, the same key v2.9/v2.9.1 were already built with.
    signingConfigs {
        debug {
            storeFile = rootProject.file("../.tooling/signing/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }
    defaultConfig {
        applicationId = "com.mahesh.workouttracker"
        // v3.4: minSdk 24 -> 26. The Health Connect client library's
        // manifest declares minSdk 26 and the manifest merger refuses
        // anything lower (no overrideLibrary hack — that would lie to
        // the merger). Cost: Android 7.0/7.1 (API 24/25) devices can no
        // longer install the app; Health Connect itself needs API 26+
        // era hardware anyway. Android 8.0+ is unaffected.
        minSdk = 26
        targetSdk = 34
        versionCode = 24
        versionName = "3.8.1"
    }
    buildTypes { getByName("release") { } }
    // v2.9: kotlinx-coroutines (via play-services-auth) and kotlin-stdlib
    // both ship this metadata file; drop it from the APK.
    packaging {
        resources {
            excludes += "META-INF/kotlin-project-structure-metadata.json"
            // v3.4: the KMP jars now in the graph (kotlinx-coroutines,
            // androidx.annotation 1.8.1) carry Kotlin/Native link-data
            // and manifest markers under commonMain/ that collide with
            // each other at packaging; build metadata, never runtime
            // resources on Android.
            excludes += "commonMain/**"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}
dependencies {
    implementation("androidx.appcompat:appcompat:1.7.0")
    // v3.7: RecyclerView for the two approved scrolling surfaces — the
    // hub's exercise list (drag reorder within a section) and the card
    // screen's horizontal exercise strip. 1.3.2 is the release paired
    // with appcompat 1.7.0; mirrored into the offline localrepo via
    // ~/workspace/.tooling/resolve.py (extra-roots.txt).
    implementation("androidx.recyclerview:recyclerview:1.3.2")
    // v2.9/v2.9.1: Google Identity Services Authorization API
    // (client-side only; no google-services plugin / google-services.json
    // needed). Resolved into the offline localrepo via
    // ~/workspace/.tooling/resolve.py.
    implementation("com.google.android.gms:play-services-auth:22.0.0")
    // v3.4: Health Connect client + coroutines for its suspend APIs,
    // mirrored into the offline localrepo (resolver + manual curl for the
    // POM hard-range proto artifacts, as with 1.1.0 before it).
    // Version pinned at 1.1.0-alpha08 ON PURPOSE: the 1.1.0 stable (and
    // alpha09+/beta01+) AAR metadata demands compileSdk 36 and AGP
    // 8.9.1+, which this project's pinned toolchain (compileSdk 34,
    // AGP 8.5.2) cannot satisfy; alpha08 is the newest release built
    // against compileSdk 34 (minCompileSdk 34, minSdk 26) and its API
    // surface for everything used here was verified with javap.
    // NOTE: the library manifest declares minSdk 26 — see defaultConfig.
    implementation("androidx.health.connect:connect-client:1.1.0-alpha08")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")
}
configurations {
    implementation {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}
